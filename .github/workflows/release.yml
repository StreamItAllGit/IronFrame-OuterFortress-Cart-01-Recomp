name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      APP_ISOLATED_TEST: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    outputs:
      artifact_id: ${{ steps.upload-unsigned.outputs.artifact-id }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content Dev\version.txt -Raw).Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME.StartsWith('v')) {
            $v = $env:GITHUB_REF_NAME.Substring(1)
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build DualSetup8 release bundle (unsigned CI staging)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File Dev\scripts\build_release.ps1 -Version "${{ steps.ver.outputs.version }}" -SkipSigning -SkipSourceArchive
          New-Item -ItemType Directory -Path "ci-bundle" -Force | Out-Null
          Get-ChildItem "Releases\v${{ steps.ver.outputs.version }}" -File | Where-Object { $_.Name -notlike "*-Setup-*.exe" -and $_.Name -ne "SHA256SUMS.txt" } | ForEach-Object {
            Copy-Item $_.FullName "ci-bundle\" -Force
          }

      - name: Upload unsigned installers for SignPath
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installers-v${{ steps.ver.outputs.version }}
          path: Releases/v${{ steps.ver.outputs.version }}/*-Setup-*.exe
          if-no-files-found: error

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: IronFrame-OuterFortress-Cart-01-v${{ steps.ver.outputs.version }}-win-x64
          path: ci-bundle/*
          if-no-files-found: error

  sign:
    needs: build
    runs-on: windows-latest
    if: ${{ vars.SIGNPATH_PROJECT_SLUG != '' }}
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: IronFrame-OuterFortress-Cart-01-v${{ needs.build.outputs.version }}-win-x64
          path: dist

      - name: Submit signing request to SignPath Foundation
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ needs.build.outputs.artifact_id }}
          wait-for-completion: true
          output-artifact-directory: dist

      - name: Regenerate SHA256SUMS.txt
        shell: pwsh
        run: |
          $lines = Get-ChildItem "dist" -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | Sort-Object { $_.Name.ToLowerInvariant() } | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $($_.Name)"
          }
          [System.IO.File]::WriteAllText((Resolve-Path "dist").Path + "\SHA256SUMS.txt", ($lines -join "`r`n") + "`r`n", [System.Text.Encoding]::ASCII)

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IronFrame-OuterFortress-Cart-01-signed-v${{ needs.build.outputs.version }}-win-x64
          path: dist/*

      - name: Publish signed assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            $pre = if ($tag -match '^v0\.|-(alpha|beta|rc|nightly|hf)') { @("--prerelease") } else { @() }
            gh release create $tag @pre --title "IronFrame OuterFortress (Cart) 01 $tag" --notes-file "dist/RELEASE_NOTES.md"
          }
          $files = Get-ChildItem "dist" -File | ForEach-Object { $_.FullName }
          gh release upload $tag @files --clobber
