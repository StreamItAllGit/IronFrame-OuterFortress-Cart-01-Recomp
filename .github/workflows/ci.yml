name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Verify clean-room repository hygiene
        shell: pwsh
        run: |
          $forbidden = @(Get-ChildItem -Recurse -Force -File | Where-Object { $_.Extension -in @('.nes', '.prg', '.bin', '.sav') -or $_.Name -ilike '*.Generated.dll' })
          if ($forbidden.Count -gt 0) {
            throw "Clean-room policy failure: forbidden media/generated binary found: $($forbidden.FullName -join ', ')"
          }

      - name: Build solution (/warnaserror)
        shell: pwsh
        run: dotnet build Dev\IronFrameCart01.slnx -c Release /warnaserror

      - name: Run zero-asset isolated unit tests
        shell: pwsh
        env:
          APP_ISOLATED_TEST: "1"
        run: dotnet test Dev\IronFrameCart01.slnx -c Release --no-build --logger "console;verbosity=minimal"

      - name: Verify 2-member clean-room .recomp packager
        shell: pwsh
        run: |
          $tmpRecomp = Join-Path $env:RUNNER_TEMP "IronFrame-OuterFortress-Cart-01.recomp"
          powershell -NoProfile -ExecutionPolicy Bypass -File Dev\scripts\pack_recomp_module.ps1 -OutputPath $tmpRecomp
          powershell -NoProfile -ExecutionPolicy Bypass -File Dev\scripts\pack_recomp_module.ps1 -OutputPath $tmpRecomp -VerifyOnly
